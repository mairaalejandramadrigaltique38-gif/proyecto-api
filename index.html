<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub User Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <h1>GitHub User Search</h1>

        <div class="buscador">
            <input
                type="text"
                id="busqueda"
                placeholder="Busca un usuario de GitHub"
            >

            <button id="btnBuscar">
                Buscar
            </button>
        </div>

        <section id="resultado" class="resultado">

            <p>
                Busca un usuario para consultar su información.
            </p>

        </section>

    </main>

    <footer>
        <p>Proyecto desarrollado con HTML, CSS, JavaScript y API</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
